name: App iOS → captures App Store

# Captures 6,9" (1320 × 2868) de l'app branchée sur le site principal, sur un simulateur iPhone 17 Pro Max.
# Lancement manuel (onglet Actions, une fois ce fichier sur main) ou à chaque modification du script sur develop ;
# les images sont dans l'artefact « captures-app-store ».
# Sur Mac Apple silicon : le simulateur d'un Mac Intel affiche les emojis en « ? ».
# Tourne sur le Mac de l'admin (runner « party-mac ») : simulateur « Party CI » créé pour l'occasion puis supprimé,
# ses propres simulateurs ne sont jamais touchés ; build dans le dossier temporaire du job.
on:
  push:
    branches: [develop]
    paths: ["ios/scripts/screenshots.sh", ".github/workflows/ios-screenshots.yml"]
  workflow_dispatch:
    inputs:
      site:
        description: Site affiché
        type: choice
        options: [production, test]
        default: production

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: [self-hosted, party-mac]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Build Debug pour le simulateur
        working-directory: ios
        run: |
          set -o pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen
          # Debug = VendrediPartyBETA ; pour la production on reprend les réglages de la configuration Release.
          if [ "${{ inputs.site }}" = test ]; then
            VARIANT=()
          else
            VARIANT=(PARTY_BUNDLE_SUFFIX= PARTY_HOST=party.bobycharbon.ch
                     "PARTY_DISPLAY_NAME=Party" ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon)
          fi
          xcodebuild build -project Party.xcodeproj -scheme Party -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO "${VARIANT[@]}" | tail -5

      - name: Captures
        env:
          BUNDLE_ID: ${{ inputs.site == 'test' && 'ch.bobycharbon.party.beta' || 'ch.bobycharbon.party' }}
          DEVICE_NAME: Party CI
        run: |
          xcrun simctl create "Party CI" "iPhone 17 Pro Max" > "$RUNNER_TEMP/sim-udid"
          ios/scripts/screenshots.sh "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Party.app" "$RUNNER_TEMP/captures"

      - uses: actions/upload-artifact@v4
        with:
          name: captures-app-store
          path: ${{ runner.temp }}/captures/*.png

      - name: Nettoyage (simulateur Party CI, build)
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/sim-udid" ]; then
            UDID=$(cat "$RUNNER_TEMP/sim-udid")
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
            xcrun simctl delete "$UDID" || true
          fi
          rm -rf "$RUNNER_TEMP/DerivedData"

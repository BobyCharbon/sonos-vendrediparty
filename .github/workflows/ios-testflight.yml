name: App iOS → TestFlight

# Compile l'app iOS (ios/) sur un Mac de GitHub, la signe et l'envoie à App Store Connect / TestFlight.
# develop → VendrediPartyBETA (ch.bobycharbon.party.beta, site de test) ;
# main → VendrediParty (ch.bobycharbon.party, site principal, App Store). Lancement manuel possible (onglet Actions).
# Secrets requis (Settings › Secrets and variables › Actions) : clé API App Store Connect, rôle Admin
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contenu du fichier AuthKey_XXXX.p8).
on:
  push:
    branches: [main, develop]
    paths: ["ios/**", ".github/workflows/ios-testflight.yml"]
  workflow_dispatch:
    inputs:
      site:
        description: Site chargé par l'app
        type: choice
        options: [test, production]
        default: test

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PRODUCTION: ${{ (github.event_name == 'workflow_dispatch' && inputs.site == 'production' || github.event_name == 'push' && github.ref_name == 'main') && '1' || '0' }}
      ARCHIVE: ${{ github.workspace }}/build/Party.xcarchive
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Clé API App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::Secrets ASC_KEY_ID, ASC_ISSUER_ID et ASC_KEY_P8 manquants (voir ios/README.md, étape 6)"
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "AUTH_FLAGS=-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Projet Xcode (XcodeGen)
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen

      - name: Archive (Release, numéro de build = numéro d'exécution)
        working-directory: ios
        run: |
          set -o pipefail
          # Release = VendrediParty ; la BETA reprend les réglages de la configuration Debug (project.yml).
          if [ "$PRODUCTION" = 1 ]; then
            VARIANT=()
          else
            VARIANT=(PARTY_BUNDLE_SUFFIX=.beta PARTY_HOST=partytest.bobycharbon.ch
                     "PARTY_DISPLAY_NAME=Party BETA" ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon-Beta)
          fi
          echo "Variante : ${VARIANT[*]:-VendrediParty (production)}"
          xcodebuild archive \
            -project Party.xcodeproj -scheme Party -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            "${VARIANT[@]}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            $AUTH_FLAGS | tail -60

      - name: Envoi à TestFlight
        working-directory: ios
        run: |
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            $AUTH_FLAGS

      - name: Nettoyage de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

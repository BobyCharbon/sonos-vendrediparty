name: Image Docker

# develop = site de test : l'image part tout de suite (≈ 3 min), les tests tournent à côté et préviennent s'ils échouent
#           (la suite complète est déjà passée sur le Mac avant chaque envoi).
# main    = production, utilisée par tout le monde : AUCUNE image tant que tous les tests ne sont pas verts.
# Tout tourne sur le runner auto-hébergé du serveur (party-linux, deploy/runner/) : dépôt privé, minutes GitHub payantes.
# Le build passe par un builder buildx à part (docker-container) : l'image n'arrive jamais dans les images locales du
# serveur, où les tags :develop / :latest des sites restent ceux tirés du registre par Dockhand.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read   # « packages: write » seulement pour les jobs qui publient l'image

jobs:
  tests:
    runs-on: [self-hosted, party-linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        # Répartis sur les cœurs de la machine (pytest-xdist) : la suite prenait ~58 min sur un seul.
        run: |
          pip install -q -r requirements.txt pytest pytest-xdist
          python -m pytest -q -n auto

  # Site de test : sans attendre les tests. Autre branche (lancement manuel) : image construite, jamais publiée.
  image-develop:
    if: github.ref_name != 'main'
    runs-on: [self-hosted, party-linux]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref_name == 'develop' }}
          # Base Supabase de TEST (Vendrediparty-test).
          build-args: |
            SUPABASE_URL=https://ewromqfsmcqsthftyhzm.supabase.co
            SUPABASE_ANON_KEY=sb_publishable_1kfxN29-r1VqjanyXvGZSQ_TBvjPU0k
          # develop → :develop (site de test partytest.bobycharbon.ch)
          tags: |
            ghcr.io/bobycharbon/sonos-vendrediparty:develop
            ghcr.io/bobycharbon/sonos-vendrediparty:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Production : seulement si TOUS les tests sont verts.
  image-main:
    if: github.ref_name == 'main'
    needs: tests
    runs-on: [self-hosted, party-linux]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Base Supabase de PRODUCTION (valeurs par défaut du Dockerfile).
          # main → :latest (production)
          tags: |
            ghcr.io/bobycharbon/sonos-vendrediparty:latest
            ghcr.io/bobycharbon/sonos-vendrediparty:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

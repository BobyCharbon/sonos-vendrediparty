name: Image Docker

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Événements : actifs sur le site de test (develop), « Bientôt » en production (main).
          # Base Supabase : TEST (Vendrediparty-test) pour develop, PRODUCTION (valeurs par défaut) pour main.
          build-args: |
            EVENTS_ENABLED=${{ github.ref_name == 'develop' && '1' || '0' }}
            SUPABASE_URL=${{ github.ref_name == 'develop' && 'https://ewromqfsmcqsthftyhzm.supabase.co' || '' }}
            SUPABASE_ANON_KEY=${{ github.ref_name == 'develop' && 'sb_publishable_1kfxN29-r1VqjanyXvGZSQ_TBvjPU0k' || '' }}
          # main → :latest (production) ; develop → :develop (site de test partytest.bobycharbon.ch)
          tags: |
            ghcr.io/bobycharbon/sonos-vendrediparty:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
            ghcr.io/bobycharbon/sonos-vendrediparty:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

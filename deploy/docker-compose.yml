# Stack à coller dans Dockhand / Portainer.
# Les variables (ADMIN_PIN, SPOTIFY_*…) se renseignent dans l'interface de la stack.
services:
  vendrediparty:
    image: ghcr.io/bobycharbon/sonos-vendrediparty:latest
    # Retélécharge l'image à chaque déploiement (sinon un redeploy garde l'ancienne version).
    pull_policy: always
    container_name: vendrediparty
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: ${PORT:-8090}
      ADMIN_PIN: ${ADMIN_PIN}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_MARKET: ${SPOTIFY_MARKET:-CH}
      # Avis : une seule liste, gardée par la production ; même secret (32 caractères au moins) sur les deux piles.
      FEEDBACK_SYNC_SECRET: ${FEEDBACK_SYNC_SECRET:-}
      # Notifications de l'app iOS native (app/apns.py) : clé APNs .p8 (contenu) et son identifiant.
      APNS_KEY_P8: ${APNS_KEY_P8:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      SONOS_IP: ${SONOS_IP:-192.168.50.186}
      # IP de HAProxy (pfSense) : seule source autorisée à transmettre la vraie IP des invités.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-192.168.50.1}
      # Retours → Claude (admin, bouton 🤖) : jeton GitHub fine-grained, permission Issues uniquement. Vide = désactivé.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-BobyCharbon/sonos-vendrediparty}
    volumes:
      - vendrediparty-data:/data

volumes:
  vendrediparty-data:

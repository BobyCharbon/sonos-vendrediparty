# Projet Xcode de l'app iOS « Party ! » — généré par XcodeGen (brew install xcodegen ; cd ios ; xcodegen).
# Le fichier Party.xcodeproj n'est pas versionné : on le régénère depuis ce fichier.
name: Party
options:
  bundleIdPrefix: ch.bobycharbon
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Identifiant d'équipe Apple Developer.
    DEVELOPMENT_TEAM: GS2B6GA9JA
    CODE_SIGN_STYLE: Automatic
    # Trousseau partagé par l'app et son extension « Partager » (session de l'invité), une par variante.
    PARTY_KEYCHAIN_GROUP: "$(DEVELOPMENT_TEAM).ch.bobycharbon.party$(PARTY_BUNDLE_SUFFIX).session"
  configs:
    # Deux apps distinctes (identifiant, nom, site) :
    # Debug = VendrediPartyBETA (site de test, develop), Release = VendrediParty (site principal, main).
    # Le workflow TestFlight passe ces mêmes réglages en ligne de commande pour archiver la BETA en Release.
    Debug:
      PARTY_BUNDLE_SUFFIX: ".beta"
      PARTY_HOST: partytest.bobycharbon.ch
      PARTY_DISPLAY_NAME: "Party BETA"
    Release:
      PARTY_BUNDLE_SUFFIX: ""
      PARTY_HOST: party.bobycharbon.ch
      PARTY_DISPLAY_NAME: "Party"

targets:
  Party:
    type: application
    platform: iOS
    sources:
      - path: Party
    scheme:
      testTargets: [PartyTests, PartyUITests]
    info:
      path: Party/Info.plist
      properties:
        CFBundleDisplayName: "$(PARTY_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        PartyBaseURL: "$(PARTY_BASE_URL)"
        PartyKeychainGroup: "$(PARTY_KEYCHAIN_GROUP)"
        # Live Activity « Ton titre arrive » (écran verrouillé, Dynamic Island).
        NSSupportsLiveActivities: true
        # Mises à jour par push fréquentes (file de la soirée qui bouge souvent).
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Pour scanner le QR code de l'hôte et prendre une photo de profil ou d'événement."
        NSPhotoLibraryUsageDescription: "Pour choisir une photo de profil ou d'événement."
        NSMicrophoneUsageDescription: "Pour enregistrer tes messages vocaux dans les Discussions et pour les jeux qui utilisent le micro."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Party/Party.entitlements
      properties:
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:$(PARTY_HOST)
        keychain-access-groups:
          - $(PARTY_KEYCHAIN_GROUP)
    dependencies:
      - target: PartyShare
      - target: PartyWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party$(PARTY_BUNDLE_SUFFIX)
        PARTY_BASE_URL: "https://$(PARTY_HOST)"
        # iPhone seulement : sur iPad, l'app tourne en mode compatible (pas de captures iPad à fournir).
        # Au niveau de la cible : le préréglage XcodeGen d'une app iOS impose sinon "1,2".
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Icône marquée BETA pour VendrediPartyBETA (le workflow la passe aussi en ligne de commande).
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Beta
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Extension « Partager › Party » : un lien Spotify, YouTube, Deezer ou Apple Music partagé depuis une autre app
  # part dans la file de la soirée. Elle reprend la session de l'app (trousseau partagé, Party/Shared).
  PartyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PartyShare
      - path: Party/Shared
      - path: Party/Music/MusicModels.swift
      - path: Party/Music/PartyAPI.swift
      - path: Party/Feedback/FeedbackModels.swift
      - path: Party/Settings/NotificationModels.swift
    info:
      path: PartyShare/Info.plist
      properties:
        CFBundleDisplayName: "$(PARTY_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        PartyBaseURL: "https://$(PARTY_HOST)"
        PartyKeychainGroup: "$(PARTY_KEYCHAIN_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: PartyShare/PartyShare.entitlements
      properties:
        keychain-access-groups:
          - $(PARTY_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party$(PARTY_BUNDLE_SUFFIX).share
        TARGETED_DEVICE_FAMILY: "1"

  # Tests unitaires (Swift Testing) : modèles de l'écran Musique, barre d'onglets.
  # xcodebuild test -project Party.xcodeproj -scheme Party -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
  PartyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PartyTests
    dependencies:
      - target: Party
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party.tests

  # Tests d'interface (simulateur) : vrais gestes sur les écrans natifs, sans serveur (état de démonstration).
  PartyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PartyUITests
    dependencies:
      - target: Party
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party.uitests
        TEST_TARGET_NAME: Party

  # Extension WidgetKit : dessine la Live Activity « Ton titre arrive » (démarrée par l'app, TrackActivities).
  PartyWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: PartyWidgets
      - path: Party/LiveActivity/TrackActivityAttributes.swift
    info:
      path: PartyWidgets/Info.plist
      properties:
        CFBundleDisplayName: "$(PARTY_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party$(PARTY_BUNDLE_SUFFIX).widgets
        TARGETED_DEVICE_FAMILY: "1"


  # App Apple TV (« Party TV ») : la partie en cours en grand, vue en spectateur, et la file de la musique dans un coin.
  # Même identifiant que l'app iPhone (achat universel) : la BETA TestFlight s'installe aussi sur l'Apple TV.
  PartyTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: PartyTV
    scheme:
      testTargets: [PartyTVTests]
    info:
      path: PartyTV/Info.plist
      properties:
        CFBundleDisplayName: "$(PARTY_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        PartyBaseURL: "$(PARTY_BASE_URL)"
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        # Serveur local seulement (essais sur le simulateur) ; le site de la soirée reste en HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party$(PARTY_BUNDLE_SUFFIX)
        PARTY_BASE_URL: "https://$(PARTY_HOST)"
        TARGETED_DEVICE_FAMILY: "3"
      configs:
        # Icônes marquées BETA pour Party BETA ; Party (production) les a sans bandeau (ios/scripts/tv_icons.py).
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image Beta"
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

  # Tests unitaires de l'app Apple TV (lecture des vues de jeu, file de la musique).
  # xcodebuild test -project Party.xcodeproj -scheme PartyTV -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)'
  PartyTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: PartyTVTests
        excludes: ["*.json"]
      - path: PartyTVTests/samples.json
        buildPhase: resources
      - path: PartyTVTests/samples-all.json
        buildPhase: resources
    dependencies:
      - target: PartyTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party.tvtests

# Projet Xcode de l'app iOS « Party ! » — généré par XcodeGen (brew install xcodegen ; cd ios ; xcodegen).
# Le fichier Party.xcodeproj n'est pas versionné : on le régénère depuis ce fichier.
name: Party
options:
  bundleIdPrefix: ch.bobycharbon
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Identifiant d'équipe Apple Developer.
    DEVELOPMENT_TEAM: GS2B6GA9JA
    CODE_SIGN_STYLE: Automatic
    # Trousseau partagé par l'app et son extension « Partager » (session de l'invité), une par variante.
    PARTY_KEYCHAIN_GROUP: "$(DEVELOPMENT_TEAM).ch.bobycharbon.party$(PARTY_BUNDLE_SUFFIX).session"
  configs:
    # Deux apps distinctes (identifiant, nom, site) :
    # Debug = VendrediPartyBETA (site de test, develop), Release = VendrediParty (site principal, main).
    # Le workflow TestFlight passe ces mêmes réglages en ligne de commande pour archiver la BETA en Release.
    # PARTY_SWIFT_CONDITIONS = BETA : Zicou (widget, Live Activity d'éclosion, actions rapides) n'est compilé que dans
    # la BETA ; l'app de l'App Store (Release sans ce réglage) n'en contient rien. Le workflow le passe pour la BETA.
    Debug:
      PARTY_BUNDLE_SUFFIX: ".beta"
      PARTY_HOST: partytest.bobycharbon.ch
      PARTY_DISPLAY_NAME: "Party BETA"
      PARTY_SWIFT_CONDITIONS: BETA
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(PARTY_SWIFT_CONDITIONS)"
    Release:
      PARTY_BUNDLE_SUFFIX: ""
      PARTY_HOST: party.bobycharbon.ch
      PARTY_DISPLAY_NAME: "Party !"
      PARTY_SWIFT_CONDITIONS: ""
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(PARTY_SWIFT_CONDITIONS)"

# Manifestes de confidentialité (PrivacyInfo.xcprivacy, exigés par Apple) : un par cible, dans son dossier (Party/,
# PartyShare/, PartyWidgets/, PartyTV/), repris en ressource avec les sources. Aucun suivi publicitaire (tracking) ;
# UserDefaults standard (raison CA92.1, pas de groupe d'apps : le partage passe par le trousseau) ; dates des fichiers
# de l'app (FileTimestamp, raison C617.1 : cache des Souvenirs). Chaque API « à raison requise » compilée dans une cible
# est déclarée dans SON manifeste (test_required_reason_apis_are_declared_by_each_target).
targets:
  Party:
    type: application
    platform: iOS
    sources:
      - path: Party
      # Le dessin de Zicou des widgets, réutilisé tel quel par la fiche profil (Settings/Account/MemberZicouView.swift).
      - path: PartyWidgets/ZicouArt.swift
    scheme:
      testTargets: [PartyTests, PartyUITests]
    info:
      path: Party/Info.plist
      properties:
        CFBundleDisplayName: "$(PARTY_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        PartyBaseURL: "$(PARTY_BASE_URL)"
        PartyKeychainGroup: "$(PARTY_KEYCHAIN_GROUP)"
        # Live Activity « Ton titre arrive » (écran verrouillé, Dynamic Island).
        NSSupportsLiveActivities: true
        # Mises à jour par push fréquentes (file de la soirée qui bouge souvent).
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        # Portrait sur les iPhone classiques (gardé : rien ne change pour eux). L'écran intérieur de l'iPhone Duo
        # ignore ce verrou (Apple) : l'app y suit toute taille et toute orientation (CLAUDE.md, « iPhone Duo »).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Textes par variante (contrôle Apple du 26.11) : l'app App Store ne cite ni Souvenirs ni l'Agenda, absents de
        # son binaire ; la BETA aussi depuis le 28.11 (copie exacte de l'app App Store : mêmes textes). PARTY_USAGE_*_STORE (App Store) ou *_STORE_beta (BETA), choisis par
        # PARTY_VARIANT (réglages de la cible Party, plus bas).
        NSCameraUsageDescription: "$(PARTY_USAGE_CAMERA_$(PARTY_VARIANT))"
        NSPhotoLibraryUsageDescription: "Pour choisir une photo de profil, d'événement, de groupe, de discussion ou un ticket du Pot commun."
        # Appui long sur une image de la page (photo d'événement, billet QR) › « Ajouter à Photos » : sans ce texte, iOS
        # ferme l'app (WKWebView garde son menu d'image).
        NSPhotoLibraryAddUsageDescription: "$(PARTY_USAGE_PHOTO_ADD_$(PARTY_VARIANT))"
        NSSpeechRecognitionUsageDescription: "Pour transformer ta voix en texte quand tu dictes (la description d'un événement pour l'assistant IA, ton avis). La transcription est faite par Apple."
        NSMicrophoneUsageDescription: "Seulement quand tu touches le micro : pour dicter un texte (la description d'un événement à l'assistant IA, ton avis) ou enregistrer un message vocal dans une discussion."
        # Agenda (17.11) : « Rien ne quitte ton iPhone » n'est plus vrai quand on partage ses dispos (conformite.md, règle 8).
        NSCalendarsFullAccessUsageDescription: "$(PARTY_USAGE_CALENDAR_$(PARTY_VARIANT))"
        NSCalendarsUsageDescription: "$(PARTY_USAGE_CALENDAR_$(PARTY_VARIANT))"
        NSContactsUsageDescription: "Pour afficher les membres Party qui sont dans tes contacts sous le nom que tu leur as donné, te les proposer quand tu écris un nouveau message, et lister dans « À inviter » ceux qui n'ont pas encore de compte, pour les inviter par SMS si tu le choisis. Seule une empreinte des numéros est comparée ; tes contacts restent sur ton iPhone."
        ITSAppUsesNonExemptEncryption: false
        # Actions rapides de l'icône (appui long) : Party/QuickActions.swift, toutes ajoutées par l'app (aucune dans
        # Info.plist) : « Ajouter un titre » dans l'app BETA seulement (Musique cachée dans l'app App Store, 25.11) ;
        # « Zicou » et « Cadeau du jour » si le Compagnon est ouvert sur le site.
    entitlements:
      path: Party/Party.entitlements
      properties:
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:$(PARTY_HOST)
        keychain-access-groups:
          - $(PARTY_KEYCHAIN_GROUP)
    dependencies:
      - target: PartyShare
      - target: PartyWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party$(PARTY_BUNDLE_SUFFIX)
        PARTY_BASE_URL: "https://$(PARTY_HOST)"
        # Variante d'après PARTY_BUNDLE_SUFFIX (comme AppConfig.isStoreApp) : "" → STORE, ".beta" → BETA (Debug et
        # archive TestFlight, qui passe PARTY_BUNDLE_SUFFIX=.beta). Textes d'autorisation par variante :
        PARTY_VARIANT: "STORE$(PARTY_BUNDLE_SUFFIX:c99extidentifier)"
        PARTY_USAGE_CAMERA_STORE: "Pour scanner un QR code (code de la soirée ou d'un jeu, billet) ou un ticket du Pot commun, et prendre une photo de profil, d'événement, de groupe ou à envoyer dans une discussion."
        PARTY_USAGE_CAMERA_STORE_beta: "Pour scanner un QR code (code de la soirée ou d'un jeu, billet) ou un ticket du Pot commun, et prendre une photo de profil, d'événement, de groupe ou à envoyer dans une discussion."
        PARTY_USAGE_PHOTO_ADD_STORE: "Pour enregistrer dans tes photos une image que tu choisis de garder (photo d'un événement ou d'une discussion, billet QR)."
        PARTY_USAGE_PHOTO_ADD_STORE_beta: "Pour enregistrer dans tes photos une image que tu choisis de garder (photo d'un événement ou d'une discussion, billet QR)."
        PARTY_USAGE_CALENDAR_STORE: "Pour mettre les dates d'un sondage dans ton calendrier, puis retirer celles qui ne sont pas retenues. Party ne garde ni n'envoie rien d'autre ; rien ne quitte ton iPhone."
        PARTY_USAGE_CALENDAR_STORE_beta: "Pour mettre les dates d'un sondage dans ton calendrier, puis retirer celles qui ne sont pas retenues. Party ne garde ni n'envoie rien d'autre ; rien ne quitte ton iPhone."
        # iPhone seulement : sur iPad, l'app tourne en mode compatible (pas de captures iPad à fournir).
        # Au niveau de la cible : le préréglage XcodeGen d'une app iOS impose sinon "1,2".
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Icône marquée « β » pour VendrediPartyBETA (le workflow la passe aussi en ligne de commande).
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Beta
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Extension « Partager › Party » : un lien Spotify, YouTube, Deezer ou Apple Music partagé depuis une autre app
  # part dans la file de la soirée. Elle reprend la session de l'app (trousseau partagé, Party/Shared).
  PartyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PartyShare
      - path: Party/Shared
      - path: Party/Music/MusicModels.swift
      - path: Party/Music/PartyAPI.swift
      - path: Party/Feedback/FeedbackModels.swift
      - path: Party/Settings/NotificationModels.swift
    info:
      path: PartyShare/Info.plist
      properties:
        CFBundleDisplayName: "$(PARTY_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        PartyBaseURL: "https://$(PARTY_HOST)"
        PartyKeychainGroup: "$(PARTY_KEYCHAIN_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: PartyShare/PartyShare.entitlements
      properties:
        keychain-access-groups:
          - $(PARTY_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party$(PARTY_BUNDLE_SUFFIX).share
        TARGETED_DEVICE_FAMILY: "1"

  # Tests unitaires (Swift Testing) : modèles de l'écran Musique, barre d'onglets.
  # xcodebuild test -project Party.xcodeproj -scheme Party -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
  PartyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PartyTests
    dependencies:
      - target: Party
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party.tests

  # Tests d'interface (simulateur) : vrais gestes sur les écrans natifs, sans serveur (état de démonstration).
  PartyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PartyUITests
    dependencies:
      - target: Party
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party.uitests
        TEST_TARGET_NAME: Party

  # Extension WidgetKit : Live Activities « Ton titre arrive » et « Éclosion » (démarrées par l'app,
  # TrackActivities, HatchActivities) et widget Zicou (écran d'accueil, écran verrouillé). Le widget lit le dernier
  # état de Zicou dans le trousseau partagé (Party/Pet/PetWidgetStore.swift), écrit par l'app.
  PartyWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: PartyWidgets
      - path: Party/LiveActivity/TrackActivityAttributes.swift
      - path: Party/Pet/HatchActivityAttributes.swift
      - path: Party/Pet/PetWidgetState.swift
      - path: Party/Pet/PetForecast.swift
      - path: Party/Pet/PetWidgetStore.swift
      - path: Party/Shared/SharedKeychain.swift
    info:
      path: PartyWidgets/Info.plist
      properties:
        CFBundleDisplayName: "$(PARTY_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        PartyBaseURL: "https://$(PARTY_HOST)"
        PartyKeychainGroup: "$(PARTY_KEYCHAIN_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PartyWidgets/PartyWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(PARTY_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party$(PARTY_BUNDLE_SUFFIX).widgets
        TARGETED_DEVICE_FAMILY: "1"


  # App Apple TV (« Party TV ») : la partie en cours en grand, vue en spectateur, et la file de la musique dans un coin.
  # Même identifiant que l'app iPhone (achat universel) : la BETA TestFlight s'installe aussi sur l'Apple TV.
  PartyTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: PartyTV
    scheme:
      testTargets: [PartyTVTests]
    info:
      path: PartyTV/Info.plist
      properties:
        CFBundleDisplayName: "$(PARTY_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        PartyBaseURL: "$(PARTY_BASE_URL)"
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        # Serveur local seulement (essais sur le simulateur) ; le site de la soirée reste en HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party$(PARTY_BUNDLE_SUFFIX)
        PARTY_BASE_URL: "https://$(PARTY_HOST)"
        TARGETED_DEVICE_FAMILY: "3"
      configs:
        # Icônes marquées « β » pour Party BETA ; Party (production) les a sans pastille (tools/icon/make_icons.py).
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image Beta"
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

  # Tests unitaires de l'app Apple TV (lecture des vues de jeu, file de la musique).
  # xcodebuild test -project Party.xcodeproj -scheme PartyTV -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)'
  PartyTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: PartyTVTests
        excludes: ["*.json"]
      - path: PartyTVTests/samples.json
        buildPhase: resources
      - path: PartyTVTests/samples-all.json
        buildPhase: resources
      - path: PartyTVTests/samples-outcomes.json
        buildPhase: resources
    dependencies:
      - target: PartyTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.bobycharbon.party.tvtests
